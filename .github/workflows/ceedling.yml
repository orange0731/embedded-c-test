name: Ceedling Unit Test & Coverage Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:          # 允许在 Actions 页手动触发

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Setup Python (gcovr)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 版本 pin：project.yml 是 Ceedling 1.0.x 适配版，
      # 不 pin 的话上游发新版会让 CI 在无关 commit 上挂掉
      - name: Install toolchain (pinned)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          gem install ceedling --no-document -v '~> 1.0'
          pip install "gcovr>=8,<9"

      - name: Unit tests (91 cases)
        run: ceedling test:all

      - name: Coverage gate (line>=95, branch>=90)
        run: bash scripts/check_coverage.sh

      - name: Mutation testing (6 mutants must be killed)
        run: bash scripts/run_mutation.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/gcov/
          retention-days: 14
